<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 330" role="img" aria-label="Argos, the Insect Zoo mascot: a friendly solar calculator brought to life — an LCD screen face, a solar-panel hat, a button keypad body, walking on wire legs, cable arms holding a glowing memory stick and a chip">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b97a8"/>
      <stop offset="0.16" stop-color="#e7eef7"/>
      <stop offset="0.5" stop-color="#aab5c5"/>
      <stop offset="0.84" stop-color="#e7eef7"/>
      <stop offset="1" stop-color="#828ea0"/>
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3c50"/>
      <stop offset="1" stop-color="#16212e"/>
    </linearGradient>
    <linearGradient id="lcd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c3a30"/>
      <stop offset="1" stop-color="#06231d"/>
    </linearGradient>
    <linearGradient id="stick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173a55"/>
      <stop offset="1" stop-color="#0c2233"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- WIRE LEGS + plug feet (walking; behind body) -->
  <path d="M134 256 C 128 280, 120 294, 122 300" fill="none" stroke="#9aa6b8" stroke-width="8" stroke-linecap="round"/>
  <path d="M166 256 C 176 276, 188 288, 194 296" fill="none" stroke="#9aa6b8" stroke-width="8" stroke-linecap="round"/>
  <!-- FEET: computer mice (top view) — teardrop body + two-button seam + scroll wheel; the wire-leg = the cord -->
  <g transform="translate(122 311) rotate(180)">
    <path d="M0 -11 C 7 -11 11 -5 11 1 C 11 8 6 13 0 13 C -6 13 -11 8 -11 1 C -11 -5 -7 -11 0 -11 Z" fill="#e2e8f1" stroke="#7c8a9a" stroke-width="1.5"/>
    <path d="M-9 -1 C -4 2 4 2 9 -1" fill="none" stroke="#9aa6b8" stroke-width="1"/>
    <line x1="0" y1="-9" x2="0" y2="-1" stroke="#9aa6b8" stroke-width="1.1"/>
    <rect x="-1.9" y="-9.5" width="3.8" height="5.5" rx="1.9" fill="#2b3c50"/>
  </g>
  <g transform="translate(196 308) rotate(193)">
    <path d="M0 -11 C 7 -11 11 -5 11 1 C 11 8 6 13 0 13 C -6 13 -11 8 -11 1 C -11 -5 -7 -11 0 -11 Z" fill="#e2e8f1" stroke="#7c8a9a" stroke-width="1.5"/>
    <path d="M-9 -1 C -4 2 4 2 9 -1" fill="none" stroke="#9aa6b8" stroke-width="1"/>
    <line x1="0" y1="-9" x2="0" y2="-1" stroke="#9aa6b8" stroke-width="1.1"/>
    <rect x="-1.9" y="-9.5" width="3.8" height="5.5" rx="1.9" fill="#2b3c50"/>
  </g>

  <!-- CABLE ARMS (behind body) -->
  <path d="M92 158 C 60 162, 44 176, 40 196" fill="none" stroke="#22e6c6" stroke-width="8" stroke-linecap="round"/>
  <path d="M208 158 C 240 162, 256 176, 260 196" fill="none" stroke="#ff3d9d" stroke-width="8" stroke-linecap="round"/>

  <!-- LEFT HAND: memory stick (data) -->
  <g transform="translate(30 188) rotate(-14)" filter="url(#glow)">
    <rect x="0" y="9" width="18" height="30" rx="3" fill="url(#stick)" stroke="#0b1c28" stroke-width="1.3"/>
    <rect x="3" y="0" width="12" height="11" rx="1.5" fill="url(#metal)" stroke="#5c6677" stroke-width="1"/>
    <rect x="5.5" y="3" width="7" height="5" rx="0.8" fill="#33424f"/>
    <circle cx="9" cy="18" r="2.2" fill="#22e6c6"/>
    <rect x="4" y="24" width="10" height="3" rx="1" fill="#22e6c6" opacity="0.8"/>
    <rect x="4" y="30" width="10" height="3" rx="1" fill="#22e6c6" opacity="0.55"/>
  </g>

  <!-- RIGHT HAND: a DDR5 RAM stick / DIMM (data) -->
  <g transform="translate(244 184) rotate(15)" filter="url(#glow)">
    <rect x="0" y="0" width="20" height="44" rx="2.5" fill="#123f2e" stroke="#0a2419" stroke-width="1.3"/>
    <!-- memory chips -->
    <rect x="3" y="5" width="14" height="8" rx="1" fill="#0a120c" stroke="#0a2419" stroke-width="0.6"/>
    <rect x="3" y="16" width="14" height="8" rx="1" fill="#0a120c" stroke="#0a2419" stroke-width="0.6"/>
    <!-- teal data label -->
    <rect x="3" y="27" width="14" height="3.4" rx="1" fill="#22e6c6" opacity="0.85"/>
    <rect x="3" y="32" width="9" height="3" rx="1" fill="#22e6c6" opacity="0.55"/>
    <!-- gold contact pins along the bottom + key-notch -->
    <g fill="#f0c850">
      <rect x="2" y="40" width="1.4" height="4"/><rect x="4" y="40" width="1.4" height="4"/><rect x="6" y="40" width="1.4" height="4"/><rect x="8" y="40" width="1.4" height="4"/>
      <rect x="12.4" y="40" width="1.4" height="4"/><rect x="14.4" y="40" width="1.4" height="4"/><rect x="16.4" y="40" width="1.4" height="4"/>
    </g>
  </g>

  <!-- CALCULATOR case (the engineer's everyday tool, brought to life) -->
  <rect x="86" y="110" width="128" height="150" rx="16" fill="url(#case)" stroke="#5c6677" stroke-width="2.5"/>

  <!-- LCD SCREEN = face -->
  <rect x="100" y="122" width="100" height="46" rx="7" fill="url(#lcd)" stroke="#3fe0bf" stroke-width="1.6"/>
  <g filter="url(#glow)" fill="#3fe0bf">
    <rect x="128" y="132" width="12" height="18" rx="3"/>
    <rect x="160" y="132" width="12" height="18" rx="3"/>
    <path d="M132 156 Q150 164 168 156" fill="none" stroke="#3fe0bf" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- KEYPAD (the calculator signal) -->
  <g>
    <rect x="104" y="180" width="20" height="16" rx="3" fill="#cfd6e0" stroke="#8b97a8" stroke-width="1"/>
    <rect x="128" y="180" width="20" height="16" rx="3" fill="#cfd6e0" stroke="#8b97a8" stroke-width="1"/>
    <rect x="152" y="180" width="20" height="16" rx="3" fill="#cfd6e0" stroke="#8b97a8" stroke-width="1"/>
    <rect x="176" y="180" width="20" height="16" rx="3" fill="#22e6c6" stroke="#14a89a" stroke-width="1"/>
    <rect x="104" y="200" width="20" height="16" rx="3" fill="#cfd6e0" stroke="#8b97a8" stroke-width="1"/>
    <rect x="128" y="200" width="20" height="16" rx="3" fill="#cfd6e0" stroke="#8b97a8" stroke-width="1"/>
    <rect x="152" y="200" width="20" height="16" rx="3" fill="#cfd6e0" stroke="#8b97a8" stroke-width="1"/>
    <rect x="176" y="200" width="20" height="16" rx="3" fill="#cfd6e0" stroke="#8b97a8" stroke-width="1"/>
    <rect x="104" y="220" width="20" height="16" rx="3" fill="#cfd6e0" stroke="#8b97a8" stroke-width="1"/>
    <rect x="128" y="220" width="20" height="16" rx="3" fill="#cfd6e0" stroke="#8b97a8" stroke-width="1"/>
    <rect x="152" y="220" width="20" height="16" rx="3" fill="#cfd6e0" stroke="#8b97a8" stroke-width="1"/>
    <rect x="176" y="220" width="20" height="16" rx="3" fill="#cfd6e0" stroke="#8b97a8" stroke-width="1"/>
    <rect x="104" y="240" width="20" height="16" rx="3" fill="#cfd6e0" stroke="#8b97a8" stroke-width="1"/>
    <rect x="128" y="240" width="20" height="16" rx="3" fill="#cfd6e0" stroke="#8b97a8" stroke-width="1"/>
    <rect x="152" y="240" width="20" height="16" rx="3" fill="#cfd6e0" stroke="#8b97a8" stroke-width="1"/>
    <rect x="176" y="240" width="20" height="16" rx="3" fill="#ff9d3d" stroke="#c9742a" stroke-width="1"/>
  </g>

  <!-- SOLAR BALL-CAP / VISOR (dark cells + grid, seated flush, with brim) -->
  <clipPath id="crownClip"><path d="M100 110 C 98 80, 202 80, 200 110 Z"/></clipPath>
  <!-- brim (projects forward-left over the brow) -->
  <path d="M112 105 C 80 107, 66 121, 92 124 C 112 126, 130 113, 126 105 Z" fill="#0c2233" stroke="#2a4a5e" stroke-width="1.2"/>
  <!-- crown -->
  <path d="M100 110 C 98 80, 202 80, 200 110 Z" fill="#112c3e" stroke="#caa63a" stroke-width="1.6"/>
  <g clip-path="url(#crownClip)" stroke="#f0c850" stroke-width="1.1" opacity="0.8">
    <line x1="124" y1="80" x2="124" y2="110"/>
    <line x1="150" y1="78" x2="150" y2="110"/>
    <line x1="176" y1="80" x2="176" y2="110"/>
    <line x1="104" y1="96" x2="196" y2="96"/>
  </g>
  <circle cx="150" cy="82" r="3" fill="#d8dee8" stroke="#8b97a8" stroke-width="0.8"/>
</svg>
